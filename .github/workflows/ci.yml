name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Format, test, lint and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Caches Gradle and validates the wrapper checksum.
      - uses: gradle/actions/setup-gradle@v6

      - name: Check formatting (ktlint + Compose rules)
        run: ./gradlew spotlessCheck

      - name: Unit and UI tests
        run: ./gradlew test

      - name: Android Lint
        run: ./gradlew lint

      - name: Assemble debug and release
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
